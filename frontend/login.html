<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Pixel Office</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050608;
        --card-bg: #111827;
        --border: #1f2937;
        --accent: #22c55e;
        --accent-soft: rgba(34, 197, 94, 0.12);
        --accent-hover: #16a34a;
        --text: #f9fafb;
        --muted: #9ca3af;
        --danger: #f97373;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #111827 0, var(--bg) 55%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        color: var(--text);
      }

      .auth-root {
        width: 100%;
        max-width: 420px;
        padding: 24px;
      }

      .card {
        background: linear-gradient(145deg, #020617, #020617, #020617, #020617);
        border-radius: 18px;
        padding: 24px 24px 20px;
        border: 1px solid var(--border);
        box-shadow:
          0 18px 40px rgba(0, 0, 0, 0.75),
          0 0 0 1px rgba(15, 23, 42, 0.7);
      }

      .card-header {
        margin-bottom: 18px;
      }

      .title {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.01em;
        margin: 0 0 4px;
      }

      .subtitle {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }

      .tabs {
        display: inline-flex;
        padding: 3px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(31, 41, 55, 0.9);
        margin-bottom: 16px;
      }

      .tab {
        position: relative;
        border: 0;
        border-radius: 999px;
        padding: 6px 16px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        transition: color 0.15s ease;
      }

      .tab[data-active="true"] {
        color: var(--text);
      }

      .tab[data-active="true"]::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: radial-gradient(circle at top, var(--accent-soft), rgba(15, 23, 42, 0.9));
        box-shadow:
          0 0 0 1px rgba(34, 197, 94, 0.18),
          0 6px 14px rgba(0, 0, 0, 0.8);
        z-index: -1;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 4px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      label {
        font-size: 12px;
        color: var(--muted);
      }

      input {
        width: 100%;
        border-radius: 999px;
        border: 1px solid var(--border);
        padding: 9px 12px;
        font-size: 14px;
        background: radial-gradient(circle at top, #020617, #020617);
        color: var(--text);
        outline: none;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }

      input::placeholder {
        color: rgba(148, 163, 184, 0.8);
      }

      input:focus {
        border-color: rgba(34, 197, 94, 0.9);
        box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.6);
        background: radial-gradient(circle at top, #020617, #020617);
      }

      .button {
        margin-top: 6px;
        width: 100%;
        border-radius: 999px;
        border: 0;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.02em;
        background: linear-gradient(135deg, var(--accent), #22d3ee);
        color: #020617;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow:
          0 12px 25px rgba(16, 185, 129, 0.4),
          0 0 0 1px rgba(5, 46, 22, 0.5);
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease,
          filter 0.1s ease;
      }

      .button:hover:not([data-loading="true"]) {
        filter: brightness(1.05);
        box-shadow:
          0 16px 32px rgba(16, 185, 129, 0.55),
          0 0 0 1px rgba(5, 46, 22, 0.7);
      }

      .button:active:not([data-loading="true"]) {
        transform: translateY(1px);
        box-shadow:
          0 10px 20px rgba(16, 185, 129, 0.4),
          0 0 0 1px rgba(5, 46, 22, 0.8);
      }

      .button[data-loading="true"] {
        cursor: default;
        opacity: 0.85;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        border: 2px solid rgba(15, 23, 42, 0.4);
        border-top-color: rgba(15, 23, 42, 0.9);
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error,
      .success {
        font-size: 12px;
        margin-top: 6px;
      }

      .error {
        color: var(--danger);
      }

      .success {
        color: var(--accent);
      }

      .hint {
        margin-top: 10px;
        font-size: 11px;
        color: var(--muted);
      }

      .hint a {
        color: var(--accent);
        text-decoration: none;
      }

      .hint a:hover {
        text-decoration: underline;
      }

      @media (max-width: 600px) {
        .auth-root {
          max-width: 100%;
          padding: 16px;
        }

        .card {
          padding: 20px 18px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-root">
      <div class="card">
        <header class="card-header">
          <h1 class="title">Pixel Office</h1>
          <p class="subtitle">Sign in to your workspace</p>
        </header>

        <div class="tabs" id="auth-tabs">
          <button class="tab" data-mode="login" data-active="true">Login</button>
          <button class="tab" data-mode="signup" data-active="false">Signup</button>
        </div>

        <form id="auth-form" novalidate>
          <div class="field" data-field="username" style="display: none">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="nickname" placeholder="Your name" />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@company.com"
              required
            />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
          </div>

          <button type="submit" class="button" id="auth-submit">
            <span id="auth-submit-label">Continue</span>
          </button>

          <div class="error" id="auth-error" style="display: none"></div>
          <div class="success" id="auth-success" style="display: none"></div>

          <p class="hint">
            This connects to your existing SkyOffice backend.
            <br />
            Use the same email & password you already configured.
          </p>
        </form>
      </div>
    </div>

    <script type="module" src="./src/auth.js"></script>
  </body>
</html>
