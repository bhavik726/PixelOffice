<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Character · Pixel Office</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap");

      :root {
        --sky-top: #7ebfe7;
        --sky-bottom: #bfdff2;
        --backdrop-image: url("/assets/background/backdrop_day.png");
        --cloud-image: url("/assets/background/cloud_day.png");
        --cloud: #f3f8ff;
        --panel: rgba(26, 38, 58, 0.95);
        --panel-soft: rgba(18, 28, 45, 0.88);
        --panel-border: #324a6f;
        --panel-highlight: #4e6f9d;
        --text: #f4f8ff;
        --muted: #a4b5d1;
        --input-bg: #1a243a;
        --input-border: #2b3f63;
        --accent: #29c06f;
        --accent-strong: #1ca75f;
        --danger: #ff7d7d;
        --city-a: #212f48;
        --city-b: #2a3b58;
        --city-c: #16233a;
        --window: #c7d6ea;
        --window-glow: #ffe28a;
        --star: #fff8cc;
      }

      body[data-mode="night"] {
        --sky-top: #0f1731;
        --sky-bottom: #25345b;
        --backdrop-image: url("/assets/background/backdrop_night.png");
        --cloud-image: url("/assets/background/cloud_night.png");
        --cloud: #aab4d1;
        --panel: rgba(16, 22, 39, 0.93);
        --panel-border: #304771;
        --panel-highlight: #4f6c9e;
        --text: #f0f6ff;
        --muted: #9aadcc;
        --input-bg: #141f35;
        --input-border: #2d4268;
        --accent: #34c87a;
        --accent-strong: #1cab62;
        --city-a: #111b31;
        --city-b: #19253f;
        --city-c: #0d1528;
        --window: #455676;
        --window-glow: #ffd76c;
        --star: #fff2a6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: "VT323", monospace;
        letter-spacing: 0.02em;
        position: relative;
        overflow: hidden;
      }

      .scene-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
        transition: background 260ms ease;
      }

      .scene-bg::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: var(--backdrop-image);
        background-repeat: repeat-x;
        background-position: center bottom;
        background-size: auto 100%;
        image-rendering: pixelated;
        opacity: 0.72;
        transition: opacity 260ms ease;
      }

      body[data-mode="night"] .scene-bg::before {
        opacity: 0.9;
      }

      .stars {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 260ms ease;
      }

      body[data-mode="night"] .stars {
        opacity: 1;
      }

      .star {
        position: absolute;
        width: 3px;
        height: 3px;
        background: var(--star);
        animation: twinkle 1.8s steps(2, end) infinite;
      }

      .star:nth-child(odd) {
        animation-delay: 0.8s;
      }

      .star:nth-child(3n) {
        animation-delay: 1.3s;
      }

      .clouds {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .cloud {
        position: absolute;
        width: 900px;
        height: 460px;
        background: var(--cloud-image) center / contain no-repeat;
        image-rendering: pixelated;
        opacity: 0.92;
        transition: opacity 260ms ease;
      }

      .c1 {
        top: 40px;
        left: -120px;
        animation: drift 44s linear infinite;
      }

      .c2 {
        top: 100px;
        left: -220px;
        transform: scale(1.1);
        animation: drift 58s linear infinite;
        animation-delay: -16s;
      }

      .c3 {
        top: 24px;
        left: -300px;
        transform: scale(1);
        animation: drift 66s linear infinite;
        animation-delay: -9s;
      }

      .c4 {
        top: 104px;
        left: -340px;
        transform: scale(0.95);
        animation: drift 62s linear infinite;
        animation-delay: -20s;
      }

      .c5 {
        top: 186px;
        left: -280px;
        transform: scale(1.15);
        animation: drift 70s linear infinite;
        animation-delay: -28s;
      }

      .c6 {
        top: 58px;
        left: -460px;
        transform: scale(0.88);
        animation: drift 74s linear infinite;
        animation-delay: -36s;
      }

      .city {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 28vh;
        min-height: 130px;
        pointer-events: none;
      }

      .city-row {
        position: absolute;
        inset: auto 0 0 0;
        display: flex;
        gap: 8px;
        align-items: flex-end;
        padding: 0 12px;
      }

      .city-row.back {
        height: 68%;
      }

      .city-row.front {
        height: 82%;
      }

      .building {
        flex: 1;
        min-width: 34px;
        height: var(--h);
        background: var(--city-a);
        position: relative;
      }

      .city-row.back .building {
        background: var(--city-b);
      }

      .city-row.front .building {
        background: var(--city-c);
      }

      .building::before {
        content: "";
        position: absolute;
        inset: 8px 6px 8px 6px;
        background-image: repeating-linear-gradient(
            to right,
            var(--window) 0 6px,
            transparent 6px 12px
          ),
          repeating-linear-gradient(to bottom, transparent 0 7px, rgba(0, 0, 0, 0.18) 7px 10px);
        opacity: 0.34;
      }

      body[data-mode="night"] .building::before {
        background-image: repeating-linear-gradient(
            to right,
            var(--window-glow) 0 6px,
            transparent 6px 12px
          ),
          repeating-linear-gradient(to bottom, transparent 0 7px, rgba(0, 0, 0, 0.25) 7px 10px);
        opacity: 0.76;
        animation: flicker 2.6s steps(3, end) infinite;
      }

      .ground-line {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 8px;
        background: linear-gradient(90deg, #2aa95f, #5be07f, #2aa95f);
      }

      .shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 14px;
      }

      .card {
        width: min(920px, 96vw);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        border-radius: 12px;
        overflow: hidden;
        border: 3px solid var(--panel-border);
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.08) inset,
          0 24px 42px rgba(6, 10, 21, 0.35);
        background: var(--panel);
      }

      .preview-pane {
        position: relative;
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 14px;
        border-right: 2px solid var(--input-border);
        background: linear-gradient(180deg, rgba(20, 31, 49, 0.94), rgba(16, 24, 40, 0.95));
      }

      .preview-heading {
        display: flex;
        align-items: center;
        gap: 0;
      }

      .preview-heading h1 {
        margin: 0;
        font-size: clamp(14px, 2vw, 18px);
        font-family: "Press Start 2P", cursive;
        line-height: 1.4;
      }

      .frame {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 316px;
        border-radius: 10px;
        border: 2px solid var(--input-border);
        background: linear-gradient(180deg, rgba(11, 18, 33, 0.98), rgba(13, 21, 36, 0.98));
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.03) inset,
          0 14px 24px rgba(0, 0, 0, 0.28);
        overflow: hidden;
      }

      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 20px;
        border: 1px dashed rgba(148, 163, 184, 0.14);
      }

      .frame::after {
        inset: auto 20px 20px 20px;
        height: 18px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(41, 192, 111, 0.26), transparent);
        border: 0;
        filter: blur(8px);
      }

      .character-wrap {
        position: relative;
        width: 240px;
        height: 280px;
        display: grid;
        place-items: center;
      }

      .character-glow {
        position: absolute;
        inset: 40px 48px 12px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(41, 192, 111, 0.3), transparent 68%);
        filter: blur(14px);
      }

      .character-sprite {
        position: relative;
        z-index: 1;
        width: 200px;
        height: 240px;
        image-rendering: pixelated;
        object-fit: contain;
        animation: floaty 3.8s ease-in-out infinite;
      }

      .picker-controls {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8px;
        pointer-events: none;
      }

      .arrow {
        pointer-events: auto;
        width: 42px;
        height: 42px;
        border-radius: 50px;
        border: 2px solid var(--panel-highlight);
        background: #243752;
        color: var(--text);
        cursor: pointer;
        display: grid;
        place-items: center;
        font-family: "Press Start 2P", cursive;
        font-size: 14px;
        transition: transform 90ms steps(2, end), filter 130ms ease;
      }

      .arrow:hover {
        filter: brightness(1.08);
      }

      .details-pane {
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 14px;
        background: linear-gradient(180deg, rgba(16, 24, 40, 0.95), rgba(14, 21, 35, 0.98));
      }

      .details-pane h2 {
        margin: 0;
        font-size: 14px;
        font-family: "Press Start 2P", cursive;
        line-height: 1.5;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        color: var(--muted);
        font-size: 20px;
        line-height: 1;
      }

      input {
        width: 100%;
        height: 48px;
        border-radius: 8px;
        border: 2px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text);
        padding: 0 12px;
        font-size: 24px;
        line-height: 1;
        font-family: "VT323", monospace;
        outline: none;
      }

      input:focus {
        border-color: #5a7cb1;
        box-shadow: none;
      }

      .chooser {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .choice {
        border: 2px solid var(--input-border);
        background: rgba(13, 21, 35, 0.86);
        border-radius: 10px;
        padding: 10px 8px;
        cursor: pointer;
        color: var(--text);
        transition: transform 90ms steps(2, end), border-color 130ms ease, background 130ms ease;
      }

      .choice:hover {
        border-color: #5f82b8;
      }

      .choice[data-active="true"] {
        border-color: var(--accent);
        background: rgba(41, 192, 111, 0.12);
      }

      .choice img {
        width: 100%;
        height: 96px;
        object-fit: contain;
        image-rendering: pixelated;
      }

      .choice span {
        display: block;
        margin-top: 6px;
        text-align: center;
        font-size: 18px;
        color: var(--muted);
        text-transform: capitalize;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 6px;
      }

      .primary,
      .secondary {
        min-height: 46px;
        border-radius: 50px;
        border: 2px solid var(--input-border);
        padding: 8px 12px;
        font-size: 12px;
        font-family: "Press Start 2P", cursive;
        cursor: pointer;
        transition: transform 90ms steps(2, end), filter 120ms ease;
      }

      .primary {
        flex: 1;
        color: #092012;
        background: var(--accent);
        border-color: var(--accent-strong);
      }

      .secondary {
        width: 160px;
        color: var(--text);
        background: #263752;
      }

      .primary:hover,
      .secondary:hover {
        filter: brightness(1.06);
      }

      .error {
        color: var(--danger);
        min-height: 22px;
        font-size: 18px;
        line-height: 1;
      }

      @keyframes floaty {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes drift {
        from {
          transform: translateX(-10vw);
        }
        to {
          transform: translateX(125vw);
        }
      }

      @keyframes flicker {
        0%,
        100% {
          opacity: 0.8;
        }
        33% {
          opacity: 0.4;
        }
        66% {
          opacity: 0.95;
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }

      @media (max-width: 860px) {
        body {
          overflow-y: auto;
        }

        .card {
          grid-template-columns: 1fr;
        }

        .preview-pane {
          border-right: 0;
          border-bottom: 2px solid var(--input-border);
        }

        .preview-heading h1 {
          font-size: 13px;
        }

        .chooser {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .actions {
          flex-direction: column;
        }

        .secondary {
          width: 100%;
        }

        .shell {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body data-mode="day">
    <div class="scene-bg" aria-hidden="true">
      <div class="stars">
        <span class="star" style="top: 8%; left: 11%"></span>
        <span class="star" style="top: 13%; left: 21%"></span>
        <span class="star" style="top: 11%; left: 35%"></span>
        <span class="star" style="top: 7%; left: 48%"></span>
        <span class="star" style="top: 16%; left: 58%"></span>
        <span class="star" style="top: 9%; left: 69%"></span>
        <span class="star" style="top: 18%; left: 76%"></span>
        <span class="star" style="top: 14%; left: 86%"></span>
        <span class="star" style="top: 20%; left: 6%"></span>
        <span class="star" style="top: 24%; left: 16%"></span>
        <span class="star" style="top: 22%; left: 31%"></span>
        <span class="star" style="top: 28%; left: 42%"></span>
        <span class="star" style="top: 26%; left: 54%"></span>
        <span class="star" style="top: 24%; left: 64%"></span>
        <span class="star" style="top: 22%; left: 74%"></span>
        <span class="star" style="top: 30%; left: 83%"></span>
      </div>

      <div class="clouds">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
        <div class="cloud c4"></div>
        <div class="cloud c5"></div>
        <div class="cloud c6"></div>
      </div>

      <div class="city">
        <div class="city-row back">
          <div class="building" style="--h: 66%"></div>
          <div class="building" style="--h: 54%"></div>
          <div class="building" style="--h: 70%"></div>
          <div class="building" style="--h: 58%"></div>
          <div class="building" style="--h: 64%"></div>
          <div class="building" style="--h: 52%"></div>
        </div>
        <div class="city-row front">
          <div class="building" style="--h: 74%"></div>
          <div class="building" style="--h: 88%"></div>
          <div class="building" style="--h: 68%"></div>
          <div class="building" style="--h: 84%"></div>
          <div class="building" style="--h: 72%"></div>
          <div class="building" style="--h: 80%"></div>
          <div class="building" style="--h: 64%"></div>
        </div>
        <div class="ground-line"></div>
      </div>
    </div>

    <main class="shell">
      <section class="card" aria-label="Character selection">
        <div class="preview-pane">
          <div class="preview-heading">
            <div>
              <h1>Public Lobby</h1>
            </div>
          </div>

          <div class="frame">
            <div class="character-wrap">
              <div class="character-glow"></div>
              <img id="characterPreview" class="character-sprite" src="/assets/character/selection/Adam.png" alt="Selected character preview" />
              <div class="picker-controls">
                <button type="button" class="arrow" id="prevCharacterBtn" aria-label="Previous character">&#8249;</button>
                <button type="button" class="arrow" id="nextCharacterBtn" aria-label="Next character">&#8250;</button>
              </div>
            </div>
          </div>

        </div>

        <div class="details-pane">
          <h2>Select your avatar</h2>

          <div class="field">
            <label for="displayNameInput">Name</label>
            <input id="displayNameInput" type="text" maxlength="24" placeholder="Enter your display name" autocomplete="nickname" />
          </div>

          <div class="field">
            <label>Available characters</label>
            <div class="chooser" id="characterChooser"></div>
          </div>

          <div class="error" id="selectionError"></div>

          <div class="actions">
            <button type="button" class="secondary" id="backBtn">Back</button>
            <button type="button" class="primary" id="continueBtn">Join Room</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/character-select.js"></script>
  </body>
</html>
